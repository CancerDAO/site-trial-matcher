[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "china-trial-partner-matching-demo"
version = "0.2.0"
description = "Fast local retrieval and eligibility-only matching for partner-provided Chinese trials"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
china-trial-demo = "china_trial_demo.cli:main"
china-trial-web = "china_trial_demo.web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
